version: '3.8'

services:
  api:
    build: .
    ports:
      - "8080:8080"
    volumes:
      # это чтобы данные и логи сохранялись локально
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - JWT_SECRET=your-super-secret-key-change-in-production-2024
    restart: unless-stopped